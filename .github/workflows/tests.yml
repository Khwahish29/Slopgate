name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: tests (${{ matrix.parser }})
    runs-on: ubuntu-24.04   # ubuntu-latest (26.04) has no Python 3.9 build
    strategy:
      fail-fast: false
      matrix:
        include:
          - parser: regex          # standard library only, as most of the team runs it
            install: false
          - parser: tree-sitter    # with the optional parser from requirements.txt
            install: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install optional dependencies
        if: matrix.install
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -W ignore -m unittest discover -s tests -v
